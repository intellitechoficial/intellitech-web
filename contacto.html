<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — IntelliTech</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0c0a12;
    --ink:#0c0a12;
    --ink-2:#15121f;
    --ink-3:#1c1829;
    --muted:#9b95ac;
    --accent-1:#ef3fb0;
    --accent-2:#6a5cf2;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--ink); }
  body{
    background:var(--ink);
    color:#fff;
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  .wrap{ max-width:720px; margin:0 auto; padding:0 20px; }
  @media (min-width:760px){ .wrap{ padding:0 44px; } }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0;
  }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; color:#fff; }
  .brand .sq{ width:30px; height:30px; object-fit:contain; flex-shrink:0; }
  .brand span{ font-weight:800; font-size:16px; }
  .back{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:999px;
    background:rgba(255,255,255,0.1); color:#fff; font-weight:700; font-size:13px;
    text-decoration:none; transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .2s ease;
  }
  .back:hover{ transform:translateY(-2px) scale(1.04); background:rgba(255,255,255,0.18); }
  .back svg{ width:13px; height:13px; }

  .hero{ padding:50px 0 10px; }
  @media (min-width:640px){ .hero{ padding:70px 0 10px; } }
  .tag{
    display:inline-block; font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);
    border:1px solid rgba(255,255,255,0.14); border-radius:999px; padding:6px 14px; margin-bottom:22px;
  }
  h1{ margin:0; font-size:36px; font-weight:800; line-height:1.1; letter-spacing:-0.02em; }
  @media (min-width:640px){ h1{ font-size:48px; } }
  .lead{ margin:18px 0 0; max-width:48ch; color:var(--muted); font-size:16px; line-height:1.6; }

  form{ margin:44px 0 60px; display:flex; flex-direction:column; gap:16px; }
  label{ display:block; font-family:'JetBrains Mono', ui-monospace, monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  input, textarea{
    width:100%; background:var(--ink-2); border:1px solid rgba(255,255,255,0.12); border-radius:12px;
    padding:14px 16px; color:#fff; font-family:'Work Sans', sans-serif; font-size:15px;
  }
  input:focus, textarea:focus{ outline:2px solid var(--accent-2); outline-offset:1px; }
  textarea{ min-height:130px; resize:vertical; }
  .submit-btn{
    align-self:flex-start;
    display:inline-flex; align-items:center; gap:10px;
    margin-top:6px; padding:15px 26px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(160deg, var(--accent-1), var(--accent-2)); color:#fff;
    font-weight:800; font-size:15px; font-family:inherit;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .submit-btn:hover{ transform:translateY(-3px) scale(1.02); }
  .submit-btn:active{ transform:translateY(0) scale(0.98); }

  .confirm{
    display:none; margin-top:44px; padding:18px 20px; border-radius:14px;
    background:rgba(106,92,242,0.14); border:1px solid rgba(106,92,242,0.3);
    color:#fff; font-size:14px;
  }
  .confirm.show{ display:block; }

  footer{ padding:30px 0 60px; color:var(--muted); font-size:12.5px; }
</style>
</head>

  <section class="hero">
    <span class="tag">Contacto</span>
    <h1>Hablemos de tu proyecto.</h1>
    <p class="lead">Cuéntanos qué necesitas y te respondemos en cuanto lo leamos.</p>

    <form id="contact-form">
      <div>
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" required placeholder="Tu nombre">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
      </div>
      <div>
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" required placeholder="Cuéntanos en qué podemos ayudarte"></textarea>
      </div>
      <button class="submit-btn" type="submit">
        Enviar mensaje
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l7 7-7 7M20 12H4"/></svg>
      </button>
    </form>

    <div class="confirm" id="confirm-msg">Gracias — hemos recibido tu mensaje y te contactaremos pronto.</div>
  </section>

  <footer>IntelliTech — Ideas that become business.</footer>
</div>

<script>
  document.getElementById('contact-form').addEventListener('submit', function(e){
    e.preventDefault();
    this.reset();
    document.getElementById('confirm-msg').classList.add('show');
  });
</script>

</body>
