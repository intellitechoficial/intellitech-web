<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conócenos — IntelliTech</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0c0a12;
    --ink:#0c0a12;
    --muted:#9b95ac;
    --accent-1:#ef3fb0;
    --accent-2:#6a5cf2;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--ink); height:100%; }
  body{
    background:var(--ink);
    color:#fff;
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{ color:inherit; }

  .wrap{ max-width:720px; margin:0 auto; padding:0 20px; width:100%; }
  @media (min-width:760px){ .wrap{ padding:0 44px; } }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0;
  }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; color:#fff; }
  .brand .sq{ width:30px; height:30px; border-radius:9px; background:linear-gradient(160deg, var(--accent-1), var(--accent-2)); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand span{ font-weight:800; font-size:16px; }
  .back{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:999px;
    background:rgba(255,255,255,0.1); color:#fff; font-weight:700; font-size:13px;
    text-decoration:none; transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .2s ease;
  }
  .back:hover{ transform:translateY(-2px) scale(1.04); background:rgba(255,255,255,0.18); }
  .back svg{ width:13px; height:13px; }

  main{ flex:1; display:flex; align-items:center; }
  .content{ padding:40px 0 80px; }
  .tag{
    display:inline-block; font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);
    border:1px solid rgba(255,255,255,0.14); border-radius:999px; padding:6px 14px; margin-bottom:22px;
  }
  h1{ margin:0; font-size:34px; font-weight:800; line-height:1.15; letter-spacing:-0.02em; }
  @media (min-width:640px){ h1{ font-size:44px; } }
  p{ margin:18px 0 0; max-width:44ch; color:var(--muted); font-size:16px; line-height:1.6; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="brand" href="intellitech-build-v2.html">
      <span class="sq" aria-hidden="true"></span>
      <span>IntelliTech</span>
    </a>
    <a class="back" href="intellitech-build-v2.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Volver a inicio
    </a>
  </header>
</div>

<main>
  <div class="wrap">
    <div class="content">
      <span class="tag">Conócenos</span>
      <h1>Muy pronto.</h1>
      <p>Estamos preparando esta página. Vuelve dentro de poco para conocer la historia detrás de IntelliTech.</p>
    </div>
  </div>
</main>

</body>
</html>
